services:
  kokoro:
    image: ghcr.io/seancheung/kokoro-openai-tts-api:latest
    container_name: newo-kokoro
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ./data/kokoro-cache:/root/.cache
    environment:
      KOKORO_MODEL: hexgrad/Kokoro-82M
      KOKORO_PRELOAD_LANGS: a,b
      KOKORO_PRELOAD_VOICES: bf_emma,bm_george,af_bella
      DEFAULT_RESPONSE_FORMAT: pcm
      MAX_INPUT_CHARS: "500"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
