name: Alfred microWakeWord compile

on:
  workflow_dispatch:
  push:
    branches:
      - alfred-mww
    paths:
      - "Newo/**"
      - ".github/workflows/alfred-mww-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and Newo libraries
        run: |
          set -euo pipefail
          arduino-cli config init
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.10 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib update-index
          arduino-cli lib install "ArduinoJson@7.4.3"
          arduino-cli lib install "WebSockets@2.7.2"
          arduino-cli lib install "Adafruit GFX Library@1.12.6"
          arduino-cli lib install "Adafruit ST7735 and ST7789 Library@1.11.0"
          arduino-cli lib install "esp32_opus@1.0.3"

      - name: Prepare compile-only credentials
        run: |
          cat > Newo/newo_secrets.h <<'EOF'
          #pragma once
          namespace NewoSecrets {
          constexpr char DEVICE_ID[] = "alfred-ci";
          constexpr char DEVICE_SECRET[] = "ci-placeholder-not-for-device";
          constexpr char CLOUD_CA_CERT[] = "ci-placeholder-ca";
          }
          EOF

      - name: Compile Newo
        run: |
          set -euo pipefail
          mkdir -p build/alfred-mww
          arduino-cli compile \
            --fqbn 'esp32:esp32:esp32s3:UploadSpeed=921600,USBMode=hwcdc,CDCOnBoot=default,MSCOnBoot=default,DFUOnBoot=default,UploadMode=default,CPUFreq=240,FlashMode=qio,FlashSize=16M,PartitionScheme=esp_sr_16,DebugLevel=none,PSRAM=opi,LoopCore=1,EventsCore=1,EraseFlash=none,JTAGAdapter=default,ZigbeeMode=default' \
            --build-path build/alfred-mww \
            Newo
          test -s build/alfred-mww/Newo.ino.bin
          echo "App binary size: $(stat -c%s build/alfred-mww/Newo.ino.bin) bytes"
