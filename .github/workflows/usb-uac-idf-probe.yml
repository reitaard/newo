name: ESP-IDF USB probe build

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/usb-uac-idf-probe/**"
      - ".github/workflows/usb-uac-idf-probe.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build ESP32-S3 probe with ESP-IDF 5.5.4
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32s3
          path: experiments/usb-uac-idf-probe
