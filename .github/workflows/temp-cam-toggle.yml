name: Apply camera toggle patch

on:
  push:
    branches: [newo2-production-v1]
    paths:
      - .github/workflows/temp-cam-toggle.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newo2-production-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch Telegram camera command
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('server/src/index.js')
          text = path.read_text()

          old_menu = '''  { command: "cam_on", description: "Turn Newo2 camera on" },\n  { command: "cam_off", description: "Turn Newo2 camera off" },'''
          new_menu = '''  { command: "cam", description: "Toggle Newo2 camera on/off" },'''
          assert text.count(old_menu) == 1, 'camera menu anchor mismatch'
          text = text.replace(old_menu, new_menu)

          anchor = '''async function handleCameraPower(ctx, enabled) {\n  return runCameraCommand(ctx, enabled ? "camera on" : "camera off", () => newo2Camera.camera(enabled),\n    (result) => `Status: ${bold(result.applied ? (result.enabled ? "on" : "off") : "rejected")}`);\n}\n'''
          toggle = '''\nasync function handleCameraToggle(ctx) {\n  return runCameraCommand(ctx, "camera", async () => {\n    const status = await newo2Camera.status();\n    if (!status.connected) throw new Error("Newo2 is offline");\n    const enabled = status.status?.camera_enabled === true;\n    return newo2Camera.camera(!enabled);\n  }, (result) => `Status: ${bold(result.applied ? (result.enabled ? "on" : "off") : "rejected")}`);\n}\n'''
          assert text.count(anchor) == 1, 'camera handler anchor mismatch'
          text = text.replace(anchor, anchor + toggle)

          old_registration = '''  bot.command(["cam_on", "c_on"], (ctx) => handleCameraPower(ctx, true));\n  bot.command(["cam_off", "c_off"], (ctx) => handleCameraPower(ctx, false));'''
          new_registration = '''  bot.command("cam", handleCameraToggle);'''
          assert text.count(old_registration) == 1, 'camera registration anchor mismatch'
          text = text.replace(old_registration, new_registration)

          path.write_text(text)
          PY
      - name: Validate server syntax
        run: |
          npm ci --prefix server
          node --check server/src/index.js
          node --check server/src/newo2-camera-client.js
          node --check server/src/newo2-bridge.js
          node --test server/test/newo2*.test.js
      - name: Commit camera toggle
        run: |
          if git diff --quiet -- server/src/index.js; then
            echo "No patch produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/index.js
          git commit -m "Make /cam toggle the Newo2 camera"
          git push origin HEAD:newo2-production-v1
