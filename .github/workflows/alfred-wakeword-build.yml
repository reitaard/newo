name: Alfred wake-word build

on:
  workflow_dispatch:
  push:
    branches:
      - alfred-wakeword
    paths:
      - "Newo/**"
      - ".github/workflows/alfred-wakeword-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and Newo libraries
        run: |
          set -euo pipefail
          arduino-cli config init
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.10 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib update-index
          arduino-cli lib install "ArduinoJson@7.4.3"
          arduino-cli lib install "WebSockets@2.7.2"
          arduino-cli lib install "Adafruit GFX Library@1.12.6"
          arduino-cli lib install "Adafruit ST7735 and ST7789 Library@1.11.0"
          arduino-cli lib install "esp32_opus@1.0.3"

      - name: Fetch calibrated Alfred model
        run: |
          set -euo pipefail
          mkdir -p Newo/wakeword
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/TaterTotterson/Tater-Wake-Words/main/microWakeWordsV6/alfred.tflite \
            -o Newo/wakeword/alfred.tflite
          test "$(stat -c%s Newo/wakeword/alfred.tflite)" -eq 137984
          sha256sum Newo/wakeword/alfred.tflite

      - name: Prepare compile credentials
        env:
          DEVICE_ID: ${{ secrets.NEWO_DEVICE_ID }}
          DEVICE_SECRET: ${{ secrets.NEWO_DEVICE_SECRET }}
          CLOUD_CA_CERT: ${{ secrets.NEWO_CLOUD_CA_CERT }}
        run: |
          set -euo pipefail
          DEVICE_ID="${DEVICE_ID:-ci-build}"
          DEVICE_SECRET="${DEVICE_SECRET:-ci-placeholder-not-for-device}"
          CLOUD_CA_CERT="${CLOUD_CA_CERT:-ci-placeholder-ca}"
          export DEVICE_ID DEVICE_SECRET CLOUD_CA_CERT
          python3 - <<'PY'
          import os
          from pathlib import Path
          def cpp(s):
              return s.replace('\\', '\\\\').replace('"', '\\"').replace('\r', '').replace('\n', '\\n')
          Path('Newo/newo_secrets.h').write_text(
              '#pragma once\nnamespace NewoSecrets {\n'
              f'constexpr char DEVICE_ID[] = "{cpp(os.environ["DEVICE_ID"])}";\n'
              f'constexpr char DEVICE_SECRET[] = "{cpp(os.environ["DEVICE_SECRET"])}";\n'
              f'constexpr char CLOUD_CA_CERT[] = "{cpp(os.environ["CLOUD_CA_CERT"])}";\n'
              '}\n', encoding='utf-8')
          PY

      - name: Compile Newo with Alfred
        run: |
          set -euo pipefail
          mkdir -p build/alfred-wakeword
          arduino-cli compile \
            --fqbn 'esp32:esp32:esp32s3:UploadSpeed=921600,USBMode=hwcdc,CDCOnBoot=default,MSCOnBoot=default,DFUOnBoot=default,UploadMode=default,CPUFreq=240,FlashMode=qio,FlashSize=16M,PartitionScheme=esp_sr_16,DebugLevel=none,PSRAM=opi,LoopCore=1,EventsCore=1,EraseFlash=none,JTAGAdapter=default,ZigbeeMode=default' \
            --build-path build/alfred-wakeword \
            Newo
          test -s build/alfred-wakeword/Newo.ino.bin
          sha256sum build/alfred-wakeword/Newo.ino.bin
