[project]
name = "newo-csi-tools"
version = "1.0.0"
description = "Dependency-free Newo CSI capture and replay tooling"
requires-python = ">=3.10"

[project.scripts]
newo-csi = "newo_csi.cli:main"
retrack = "retrack.cli:main"
retrackd = "retrack.cli:daemon_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
