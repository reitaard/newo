dependencies:
  idf:
    version: "5.5.5"
  espressif/esp32-camera:
    version: "2.1.7"
  espressif/esp_jpeg:
    version: "1.3.1"
  espressif/esp-dl:
    version: "3.3.11"
  espressif/human_face_detect:
    version: "0.5.0"
  espressif/human_face_recognition:
    version: "0.3.2"
  espressif/esp_new_jpeg:
    version: "1.0.2"
  espressif/led_strip:
    version: "3.0.3"

overrides:
  - espressif/human_face_detect:
      with:
        espressif/human_face_detect:
          version: "0.5.0"
      reason: "human_face_recognition 0.3.2 registry metadata still requires ~0.4.1, while its current upstream source targets ~0.5.0; Newo2 physically validated ESPDet-224 from 0.5.0, so keep that detector version for this recognition product gate."
